[workspace]
resolver = "2"
members = ["crates/game-core", "crates/game-app"]

[workspace.package]
edition = "2021"
version = "0.6.0"
license = "MIT"

[workspace.dependencies]
game-core = { path = "crates/game-core" }

# Compile faster on dev, smaller on release wasm.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
