[package]
name = "game-app"
description = "Fun-to-Drive web game (Bevy): presentation layer, native + wasm32"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# WebGPU-capable wasm build (still falls back to WebGL2 where unavailable):
# trunk build --release --features webgpu
webgpu = ["bevy/webgpu"]

[dependencies]
game-core = { workspace = true }
bevy = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Location", "Storage", "UrlSearchParams", "Window"] }

# LTO in workspace release profile trims wasm size.
