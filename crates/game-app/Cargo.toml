[package]
name = "game-app"
description = "Fun-to-Drive web game (Bevy): presentation layer, native + wasm32"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# WebGPU-capable wasm build (still falls back to WebGL2 where unavailable):
# trunk build --release --features webgpu
webgpu = ["bevy/webgpu"]

[dependencies]
game-core = { workspace = true }
# Bevy's broad `3d` bundle enables KTX2/zstd and compressed tonemapping LUTs.
# This game embeds an uncompressed GLB and does not load KTX2 assets, so keep
# the rendering surface explicit and avoid shipping an unused decoder.
bevy = { version = "0.20", default-features = false, features = [
    "2d",
    "ui",
    "audio",
    "bevy_light",
    "bevy_mikktspace",
    "morph_animation",
    "morph",
    "bevy_anti_alias",
    "bevy_gltf",
    "bevy_pbr",
    "gltf_animation",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Location", "Storage", "UrlSearchParams", "Window"] }

# LTO in workspace release profile trims wasm size.
