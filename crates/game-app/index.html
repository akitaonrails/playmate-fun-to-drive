<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fun to Drive</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #0d0e13; }
      /* winit writes inline width/height on the canvas; !important wins and
         stretches the render to fill the browser window */
      canvas { display: block; width: 100vw !important; height: 100vh !important; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; color: #9aa3b2;
        font-family: monospace; gap: 14px; transition: opacity .5s;
      }
      #loading .wheel {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid #2a2f3a; border-top-color: #c94f3d;
        animation: spin 0.9s linear infinite;
      }
      #loading .hint { font-size: 12px; color: #5d6675; }
      #fullscreen-toggle {
        position: fixed; top: 14px; right: 14px; z-index: 20;
        width: 44px; height: 44px; padding: 0;
        border: 1px solid rgba(255,255,255,.3); border-radius: 7px;
        background: rgba(8,10,15,.66); color: #e7d59b;
        font: 25px/1 monospace; cursor: pointer; opacity: .68;
        transition: opacity .15s, background .15s, transform .15s;
      }
      #fullscreen-toggle:hover,
      #fullscreen-toggle:focus-visible {
        opacity: 1; background: rgba(24,28,38,.9); outline: 2px solid #e7d59b;
        outline-offset: 2px;
      }
      #fullscreen-toggle:active { transform: scale(.94); }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <button id="fullscreen-toggle" type="button" aria-label="Enter fullscreen" title="Enter fullscreen">⛶</button>
    <div id="loading">
      <div class="wheel"></div>
      <div id="loading-text">spinning up the drum...</div>
      <div class="hint">first load prepares the game — later loads are cached</div>
      <div class="hint">controls: ARROWS steer/select &nbsp;|&nbsp; Q/E low/high &nbsp;|&nbsp; Y nitro &nbsp;|&nbsp; ENTER confirm &nbsp;|&nbsp; M mute &nbsp;|&nbsp; T toy view</div>
      <div class="hint">slower GPU? append <code>?quality=low</code> to disable bloom and reduce toy-view resolution</div>
    </div>
    <script>
      // CPAL creates its Web Audio context during Bevy startup, often before
      // the browser has granted autoplay permission. Track that exact context
      // and retry resume synchronously on every real user gesture.
      (() => {
        const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
        if (!NativeAudioContext) return;
        const contexts = new Set();
        const TrackedAudioContext = new Proxy(NativeAudioContext, {
          construct(target, args) {
            const context = Reflect.construct(target, args, target);
            contexts.add(context);
            return context;
          }
        });
        try {
          window.AudioContext = TrackedAudioContext;
          if (window.webkitAudioContext) window.webkitAudioContext = TrackedAudioContext;
        } catch (_) {}
        window.__ftdResumeAudio = () => {
          for (const context of contexts) {
            if (context.state !== 'running') context.resume().catch(() => {});
          }
        };
        for (const event of ['pointerdown', 'touchstart', 'keydown']) {
          window.addEventListener(event, window.__ftdResumeAudio, { capture: true });
        }
      })();

      // harness markers: readiness + per-frame game state from wasm
      window.__FTD_READY__ = false;
      window.__FTD_STATE__ = null;
      window.__ftdPublishState = (s) => { try { window.__FTD_STATE__ = JSON.parse(s); } catch (e) {} };
      const look = () => {
        const c = document.querySelector('canvas');
        if (c && c.width > 0) { window.__FTD_READY__ = true; return; }
        requestAnimationFrame(look);
      };
      requestAnimationFrame(look);
      setTimeout(() => {
        const l = document.getElementById('loading');
        if (l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 600); }
      }, 1200);

      // Fullscreen must be requested from a real user gesture. Keep this in
      // the host page rather than WASM so browser support stays independent
      // from the game's input system.
      (() => {
        const button = document.getElementById('fullscreen-toggle');
        const root = document.documentElement;
        const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;
        const syncButton = () => {
          const active = Boolean(fullscreenElement());
          const label = active ? 'Exit fullscreen' : 'Enter fullscreen';
          button.textContent = active ? '×' : '⛶';
          button.setAttribute('aria-label', label);
          button.title = label;
        };
        button.addEventListener('click', async () => {
          try {
            if (fullscreenElement()) {
              const exit = document.exitFullscreen || document.webkitExitFullscreen;
              await exit.call(document);
            } else {
              const enter = root.requestFullscreen || root.webkitRequestFullscreen;
              await enter.call(root, { navigationUI: 'hide' });
            }
          } catch (error) {
            button.title = `Fullscreen unavailable: ${error.message}`;
          }
        });
        document.addEventListener('fullscreenchange', syncButton);
        document.addEventListener('webkitfullscreenchange', syncButton);
        syncButton();
      })();
    </script>
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="game-app" data-type="main" />
    <link data-trunk rel="copy-dir" href="assets" />
  </body>
</html>
